[build-system]
requires = ["setuptools==75.8.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-bench"
version = "0.1.0"
description = "Recompute Panda benchmark releases and run explicit, budgeted new evaluations."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["anthropic>=0.75,<1", "openai>=1.109,<3", "pyarrow>=17,<24"]

[tool.setuptools]
packages = ["panda_bench", "panda_bench.frontier", "panda_bench.frontier.benchmarks"]
script-files = ["bin/panda-bench"]
